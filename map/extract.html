<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水晶座標の抽出ツール</title>
<style>
body{margin:0;background:#12161a;color:#e8edf2;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px}
.box{background:#1d242b;border:1px solid #33404c;border-radius:10px;padding:14px;margin:12px 0}
.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
input[type=number]{width:80px;background:#11161b;border:1px solid #33404c;color:inherit;border-radius:6px;padding:5px 8px}
button{background:#4cc3d9;border:0;color:#06222a;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.muted{color:#93a1ae;font-size:13px}
canvas{width:100%;height:auto;background:#000;border-radius:8px;display:block}
textarea{width:100%;height:120px;background:#11161b;color:inherit;border:1px solid #33404c;border-radius:6px;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<main>
  <h1>水晶座標の抽出ツール</h1>
  <p class="muted">赤丸で水晶をマークした画像（白背景・元サイズ推奨）から赤丸の中心を検出し、ゲーム座標（左下0,0／右上1200,1200）の <b>crystals.js</b> を作ります。処理はこのブラウザ内だけで行われ、画像はどこにも送信されません。8160px の画像はメモリを使うので PC での実行をおすすめします。</p>

  <div class="box">
    <div class="line"><input type="file" id="file" accept="image/*"></div>
    <div class="line">
      赤の判定：R ≥ <input type="number" id="tR" value="150">
      R−G ≥ <input type="number" id="tRG" value="70">
      R−B ≥ <input type="number" id="tRB" value="70">
    </div>
    <div class="line">
      丸の直径（px）：最小 <input type="number" id="minD" placeholder="自動">
      最大 <input type="number" id="maxD" placeholder="自動">
      <span class="muted">空欄なら画像サイズから自動設定</span>
    </div>
    <div class="line"><button id="run" disabled>検出する</button><span id="status" class="muted"></span></div>
  </div>

  <div class="box" id="result" style="display:none">
    <div class="line"><b id="count"></b><span class="muted">水色＝検出した中心、黄色＝重なった丸を分割して推定したもの（要確認）</span></div>
    <canvas id="preview"></canvas>
    <div class="line" style="margin-top:10px"><button id="dl">crystals.js をダウンロード</button></div>
    <textarea id="out" readonly></textarea>
  </div>
</main>
<script>
'use strict';
const MAP_SIZE = 1200;
let bitmap = null;
const $ = s => document.querySelector(s);

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#status').textContent = '読み込み中…';
  try{ bitmap = await createImageBitmap(f); $('#status').textContent = `${bitmap.width} × ${bitmap.height} px`; $('#run').disabled = false; }
  catch(err){ $('#status').textContent = '画像を読み込めませんでした'; }
});

// 赤丸の検出本体（mask: 1=赤, 処理中に0へ書き換える）
function detect(mask, W, H, minD, maxD){
  const comps = [];
  const stack = [];
  for (let i = 0; i < W*H; i++){
    if (!mask[i]) continue;
    let minx=W, maxx=-1, miny=H, maxy=-1; const pix = [];
    mask[i] = 0; stack.push(i);
    while (stack.length){
      const p = stack.pop(); const x = p % W, y = (p - x) / W;
      pix.push(p);
      if (x<minx) minx=x; if (x>maxx) maxx=x; if (y<miny) miny=y; if (y>maxy) maxy=y;
      for (let dy=-1; dy<=1; dy++){ const ny=y+dy; if (ny<0||ny>=H) continue;
        for (let dx=-1; dx<=1; dx++){ const nx=x+dx; if (nx<0||nx>=W) continue; const q=ny*W+nx; if (mask[q]){ mask[q]=0; stack.push(q); } } }
    }
    const size = Math.max(maxx-minx+1, maxy-miny+1);
    if (size >= minD*0.5) comps.push({minx,maxx,miny,maxy,size,n:pix.length,pix});
  }
  const normal = comps.filter(c => c.size >= minD && c.size <= maxD);
  if (!normal.length) return [];
  const med = arr => { const a=[...arr].sort((x,y)=>x-y); return a[a.length>>1]; };
  const d = med(normal.map(c=>c.size)), nMed = med(normal.map(c=>c.n));
  let pts = [];
  for (const c of comps){
    if (c.size < d*0.5) continue;                      // ノイズ
    if (c.size <= d*1.35){ pts.push({x:(c.minx+c.maxx+1)/2, y:(c.miny+c.maxy+1)/2, split:false}); continue; }
    // 重なった丸：画素数から個数を推定して k-means で分割
    const k = Math.max(2, Math.min(12, Math.round(c.n / nMed)));
    const P = c.pix.map(p => [p % W, Math.floor(p / W)]);
    const cs = [P[0]];
    while (cs.length < k){ let bi=0, bd=-1; for (let i=0;i<P.length;i++){ let m=1e18; for (const q of cs){ const dd=(P[i][0]-q[0])**2+(P[i][1]-q[1])**2; if(dd<m) m=dd; } if (m>bd){ bd=m; bi=i; } } cs.push(P[bi]); }
    let C = cs.map(q => [q[0],q[1]]);
    for (let it=0; it<20; it++){
      const sx=new Float64Array(k), syy=new Float64Array(k), cn=new Float64Array(k);
      for (const q of P){ let bj=0, bd=1e18; for (let j=0;j<k;j++){ const dd=(q[0]-C[j][0])**2+(q[1]-C[j][1])**2; if(dd<bd){bd=dd;bj=j;} } sx[bj]+=q[0]; syy[bj]+=q[1]; cn[bj]++; }
      C = C.map((c0,j) => cn[j] ? [sx[j]/cn[j], syy[j]/cn[j]] : c0);
    }
    for (const q of C) pts.push({x:q[0]+.5, y:q[1]+.5, split:true});
  }
  // 途切れた丸の断片などをまとめる
  const merged = []; const used = new Array(pts.length).fill(false);
  for (let i=0;i<pts.length;i++){
    if (used[i]) continue; let sx=pts[i].x, syy=pts[i].y, n=1, split=pts[i].split;
    for (let j=i+1;j<pts.length;j++){ if (!used[j] && Math.hypot(pts[i].x-pts[j].x, pts[i].y-pts[j].y) < d*0.45){ used[j]=true; sx+=pts[j].x; syy+=pts[j].y; n++; split = split||pts[j].split; } }
    merged.push({x:sx/n, y:syy/n, split});
  }
  return merged;
}
if (typeof module !== 'undefined') module.exports = {detect};

$('#run').addEventListener('click', async () => {
  if (!bitmap) return;
  $('#run').disabled = true;
  const W = bitmap.width, H = bitmap.height;
  const tR=+$('#tR').value, tRG=+$('#tRG').value, tRB=+$('#tRB').value;
  const minD = +$('#minD').value || Math.round(W*0.003);
  const maxD = +$('#maxD').value || Math.round(W*0.014);
  $('#status').textContent = '赤い画素を探しています…';
  await new Promise(r => setTimeout(r, 30));
  let mask;
  try{ mask = new Uint8Array(W*H); }catch(e){ $('#status').textContent = 'メモリが足りません。PCで実行するか画像を縮小してください'; $('#run').disabled=false; return; }
  const strip = 256, cv = document.createElement('canvas'); cv.width = W; cv.height = strip;
  const cx = cv.getContext('2d', {willReadFrequently:true});
  for (let y0=0; y0<H; y0+=strip){
    const h = Math.min(strip, H-y0);
    cx.clearRect(0,0,W,strip); cx.drawImage(bitmap, 0, y0, W, h, 0, 0, W, h);
    const d = cx.getImageData(0,0,W,h).data;
    for (let i=0, n=W*h; i<n; i++){ const r=d[i*4], g=d[i*4+1], b=d[i*4+2], a=d[i*4+3]; if (a>128 && r>=tR && r-g>=tRG && r-b>=tRB) mask[y0*W+i]=1; }
  }
  $('#status').textContent = '赤丸を検出しています…';
  await new Promise(r => setTimeout(r, 30));
  const pts = detect(mask, W, H, minD, maxD);
  mask = null;
  const game = pts.map(p => [Math.round(p.x/W*MAP_SIZE*10)/10, Math.round((MAP_SIZE - p.y/H*MAP_SIZE)*10)/10]);
  game.sort((a,b) => b[1]-a[1] || a[0]-b[0]);
  const js = '// 水晶の座標（ゲーム座標 [X, Y]）。extract.html で生成\nwindow.CRYSTALS = [\n' +
    game.map(g => `[${g[0]},${g[1]}]`).reduce((rows,s,i) => { if (i%10===0) rows.push([]); rows[rows.length-1].push(s); return rows; }, []).map(r => '  '+r.join(',')).join(',\n') + '\n];\n';
  $('#out').value = js;
  $('#count').textContent = `${pts.length} か所を検出（分割推定 ${pts.filter(p=>p.split).length} か所）`;
  // プレビュー
  const pv = $('#preview'), PS = Math.min(2000, W); pv.width = PS; pv.height = Math.round(H*PS/W);
  const pc = pv.getContext('2d'); pc.drawImage(bitmap, 0, 0, pv.width, pv.height);
  const k = PS/W;
  for (const p of pts){ pc.fillStyle = p.split ? '#ffd400' : '#00c8ff'; pc.beginPath(); pc.arc(p.x*k, p.y*k, Math.max(2.5, 3), 0, Math.PI*2); pc.fill(); }
  $('#result').style.display = 'block';
  $('#status').textContent = '完了';
  $('#run').disabled = false;
});
$('#dl').addEventListener('click', () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('#out').value], {type:'text/javascript'})); a.download = 'crystals.js'; a.click();
});
</script>
</body>
</html>
